[project]
name = "maxkb-mcp"
version = "1.0.0"
description = "MCP server that exposes all MaxKB API endpoints as tools for any MCP-compatible agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
maxkb-mcp = "maxkb_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maxkb_mcp*"]
